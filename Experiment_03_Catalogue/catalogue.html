<!DOCTYPE html>
<html>

<head>
    <title>Catalogue Page</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
        }

        table {
            margin: 30px auto;
            background-color: white;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
        }

        th {
            background-color: navy;
            color: white;
        }

        button {
            padding: 7px;
        }
    </style>
</head>

<body>

    <h1>Online Book Store</h1>

    <h2>Book Catalogue</h2>

    <table border="1">

        <tr>
            <th>Cover</th>
            <th>Book</th>
            <th>Author</th>
            <th>Publisher</th>
            <th>Price</th>
            <th>Add to Cart</th>
        </tr>

        <tr>
            <td>📘</td>
            <td>XML Bible</td>
            <td>Winston</td>
            <td>Wiley</td>
            <td>$40.5</td>
            <td>
                <button>Add to Cart</button>
            </td>
        </tr>

        <tr>
            <td>📗</td>
            <td>Artificial Intelligence</td>
            <td>S. Russell</td>
            <td>Prentice Hall</td>
            <td>$63</td>
            <td>
                <button>Add to Cart</button>
            </td>
        </tr>

        <tr>
            <td>📕</td>
            <td>Java 2</td>
            <td>Watson</td>
            <td>BPB Publications</td>
            <td>$35.5</td>
            <td>
                <button>Add to Cart</button>
            </td>
        </tr>

        <tr>
            <td>📙</td>
            <td>HTML in 24 Hours</td>
            <td>Sam Peter</td>
            <td>Sam Publications</td>
            <td>$50</td>
            <td>
                <button>Add to Cart</button>
            </td>
        </tr>

    </table>

</body>

</html>
