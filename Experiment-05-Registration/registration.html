<!DOCTYPE html>
<html>

<head>
    <title>Registration Page</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
        }

        form {
            background-color: white;
            width: 400px;
            margin: 30px auto;
            padding: 20px;
        }

        input, select, textarea {
            padding: 6px;
            margin: 5px;
        }

        button {
            padding: 8px 15px;
        }
    </style>
</head>

<body>

    <h1>Registration Page</h1>

    <form>

        Name:
        <br>
        <input type="text">

        <br><br>

        Password:
        <br>
        <input type="password">

        <br><br>

        E-mail ID:
        <br>
        <input type="text">

        <br><br>

        Phone Number:
        <br>
        <input type="text">

        <br><br>

        Sex:
        <br>
        <input type="radio" name="sex"> Male
        <input type="radio" name="sex"> Female

        <br><br>

        Date of Birth:
        <br>

        <select>
            <option>Day</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
        </select>

        <select>
            <option>Month</option>
            <option>January</option>
            <option>February</option>
            <option>March</option>
            <option>April</option>
            <option>May</option>
        </select>

        <select>
            <option>Year</option>
            <option>2000</option>
            <option>2001</option>
            <option>2002</option>
            <option>2003</option>
            <option>2004</option>
            <option>2005</option>
        </select>

        <br><br>

        Languages Known:
        <br>

        <input type="checkbox"> English
        <input type="checkbox"> Telugu
        <input type="checkbox"> Hindi
        <input type="checkbox"> Tamil

        <br><br>

        Address:
        <br>

        <textarea rows="4" cols="30"></textarea>

        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>

</body>

</html>
