<!DOCTYPE html>
<html>

<head>
    <title>Cart Page</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
        }

        table {
            margin: 30px auto;
            background-color: white;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
        }

        th {
            background-color: navy;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Shopping Cart</h1>

    <table border="1">

        <tr>
            <th>Book</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
        </tr>

        <tr>
            <td>XML Bible</td>
            <td>₹500</td>
            <td>1</td>
            <td>₹500</td>
        </tr>

        <tr>
            <td>Data Structures</td>
            <td>₹450</td>
            <td>2</td>
            <td>₹900</td>
        </tr>

        <tr>
            <td>Java Programming</td>
            <td>₹600</td>
            <td>1</td>
            <td>₹600</td>
        </tr>

        <tr>
            <th colspan="3">Grand Total</th>
            <th>₹2000</th>
        </tr>

    </table>

</body>

</html>
